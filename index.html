  .controls button:active{background:#2a4a6b}

  .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #16273d;cursor:pointer}

const M3U_URL = "https://iptv-org.github.io/iptv/countries/hk.m3u"; // 公开源列表（CORS 开放），应用自己拉取、自动筛选

// —— 自动更新源：启动 / 手动时拉取在线源清单覆盖本地内置源 ——
// 候选地址：1) 自托管同目录 ./channels.json（同源，最稳）；2) 线上版同站点（同源时生效，跨域失败自动跳过）
const SOURCE_CANDIDATES = [
  './channels.json',
  'https://a088c815e08a190d9.app.workbuddy.host/channels.json?sharecode=ROW5UYXDZ7'
];
async function fetchRemoteSources(){
  for(const u of SOURCE_CANDIDATES){
    try{
      const r = await fetch(u, { cache:'no-store' });
      if(!r.ok) continue;
      const j = await r.json();
      if(Array.isArray(j) && j.length && j[0] && j[0].name && Array.isArray(j[0].pool)) return j;
    }catch(e){ /* 跨域/网络失败，试下一个 */ }
  }
  return null;
}
async function applyRemote(){
  const lastName = (current>=0) ? CHANNELS[current].name : null;
  const remote = await fetchRemoteSources();
  if(!remote) return false;
  CHANNELS = remote;
  localStorage.setItem('hk_remote_channels', JSON.stringify(remote));
  if(lastName){ const ni = CHANNELS.findIndex(c=>c.name===lastName); if(ni>=0) current = ni; }
  render();
  return true;
}

  }
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._t); t._t = setTimeout(()=>{ if(t) t.style.display='none'; }, 2600);
}

function setStatus(state, txt){
  dot.className = 'dot ' + (state==='ok'?'':state==='search'?'search':'off');
  stxt.textContent = txt;

function render(){
  list.innerHTML = '';
  CHANNELS.forEach((c,i)=>{
    if(favOnly && !favs.includes(c.name)) return;
    if(query && !c.name.toLowerCase().includes(query.toLowerCase())) return;
    const isFav = favs.includes(c.name);
    const d = document.createElement('div');
    d.className = 'ch' + (i===current?' active':'');
    const badge = (i===current && !searching) ? '<span class="badge">▶ 播放中</span>'
                : (i===current && searching) ? '<span class="badge">🔄 搜索中</span>' : '';
    d.innerHTML = `<img class="ic" src="${c.icon}" onerror="this.style.visibility='hidden'">
      <div class="meta"><div class="nm">${c.name}</div><div class="sub">${c.sub}</div></div>${badge}
      <button class="star ${isFav?'on':''}" title="收藏">${isFav?'★':'☆'}</button>`;
    d.onclick = ()=> ensurePlay(i);
    d.querySelector('.star').onclick = (e)=>{
      e.stopPropagation();
      if(isFav) favs = favs.filter(x=>x!==c.name); else favs.push(c.name);
      localStorage.setItem('hk_fav_names', JSON.stringify(favs));
      render();
    };
    list.appendChild(d);
  });
  if(!list.children.length){
    list.innerHTML = '<div style="padding:20px;color:#8aa3bd;text-align:center">没有匹配的频道</div>';
  }
}

// 把某个源加载进 video，返回 Promise：首次 playing 即 resolve，致命错误或超时 reject
function trySource(url){
  return new Promise((resolve,reject)=>{
    if(hls){ hls.destroy(); hls = null; }
    let settled = false;
    const cleanup = ()=>{ video.removeEventListener('playing',ok); video.removeEventListener('error',bad); clearTimeout(timer); };
    const ok = ()=>{ if(!settled){ settled=true; cleanup(); resolve(); } };
    const bad = ()=>{ if(!settled){ settled=true; cleanup(); reject(new Error('fail')); } };
    video.addEventListener('playing', ok);
    video.addEventListener('error', bad);
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = url; video.play().catch(()=>{});
    } else if(window.Hls && Hls.isSupported()){
      hls = new Hls({ liveSyncDuration:3 });
      hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal) bad(); });
    } else { video.src = url; video.play().catch(()=>{}); }
    const timer = setTimeout(bad, 9000); // 单源最多等 9 秒
  });
}

// 联网抓取公开源列表，按关键词为本频道筛选候选源
async function fetchLiveCandidates(ch){
  try{
    const res = await fetch(M3U_URL, { cache:'no-store' });
    if(!res.ok) return [];
    const text = await res.text();
    const out = [];
    const blocks = text.split('#EXTINF:').slice(1);
    for(const b of blocks){
      const urlLine = b.split('\n').find(l=>l.trim().startsWith('http'));
      const url = urlLine && urlLine.trim();
      const label = (b.split('\n')[0]||'').split(',').slice(1).join(',').trim();
      if(!url) continue;
      const hay = (label + ' ' + b).toLowerCase();
      if(ch.kw.some(k=>hay.includes(k.toLowerCase()))) out.push({ label, url });
    }
    // 去重
    const seen = new Set();
    return out.filter(o=> o.url && !seen.has(o.url) && seen.add(o.url));
  }catch(e){ return []; }
}

// 核心：确保某频道能播——先试缓存/默认/内置备用，再联网自动搜索
async function ensurePlay(i){
  current = i; render();
  ph.style.display = 'none';
  const ch = CHANNELS[i];
  const cached = localStorage.getItem('src_'+encodeURIComponent(ch.name));
  const pool = [];
  if(cached) pool.push(cached);
  pool.push(...ch.pool);

  searching = true; render();
  // 第一轮：内置源
  for(let k=0;k<pool.length;k++){
    setStatus('search', `搜索可用源 (${k+1}/${pool.length})`);
    try{ await trySource(pool[k]); return finish(i, pool[k]); }
    catch(e){ /* 试下一个 */ }
  }
  // 第二轮：联网自动搜索公开源
  setStatus('search', '联网自动搜索新源…');
  const live = await fetchLiveCandidates(ch);
  for(let k=0;k<live.length;k++){
    setStatus('search', `联网源 (${k+1}/${live.length})`);
    try{ await trySource(live[k].url); return finish(i, live[k].url); }
    catch(e){ /* 试下一个 */ }
  }
  // 全部失败
  searching = false; render();
  setStatus('off', '未找到可用源');
  ph.style.display = 'flex';
  ph.innerHTML = `${ch.name} 当前所有源均不可用。<br>可稍后再试，或改用官方 RTHK TV App。`;
}

function finish(i, url){
  localStorage.setItem('src_'+encodeURIComponent(CHANNELS[i].name), url);
  searching = false; render();
  setStatus('ok', '直播中 · ' + CHANNELS[i].name);
}

// 观看中掉线 → 自动重搜（避开重复触发）
video.addEventListener('error', ()=>{ if(current>=0 && !searching && !video.paused) ensurePlay(current); });

document.getElementById('playBtn').onclick = ()=>{ if(current>=0) video.paused ? video.play() : video.pause(); };
document.getElementById('nextBtn').onclick = ()=> ensurePlay((current+1)%CHANNELS.length);
document.getElementById('prevBtn').onclick = ()=> ensurePlay((current-1+CHANNELS.length)%CHANNELS.length);
document.getElementById('searchBtn').onclick = ()=>{ if(current>=0) ensurePlay(current); };
document.getElementById('updateBtn').onclick = async ()=>{
  const btn = document.getElementById('updateBtn');
  btn.disabled = true; const old = btn.textContent; btn.textContent = '更新中…';
  const ok = await applyRemote();
  btn.disabled = false; btn.textContent = old;
  toast(ok ? ('已更新到 '+CHANNELS.length+' 个频道') : '未能拉取在线源，继续使用本地源');
};
document.getElementById('search').addEventListener('input', e=>{ query = e.target.value.trim(); render(); });
document.getElementById('favToggle').onclick = ()=>{
  favOnly = !favOnly;
  document.getElementById('favToggle').classList.toggle('on', favOnly);
  document.getElementById('favToggle').textContent = favOnly ? '★ 收藏' : '☆ 收藏';
  render();
};
document.getElementById('fsBtn').onclick = ()=>{
  if(!document.fullscreenElement) video.requestFullscreen?.() || video.webkitEnterFullscreen?.();
  else document.exitFullscreen?.();
};

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// 启动：先用上次缓存的远程源秒开，再后台拉取最新源清单（不打断当前播放）
(async()=>{
  const cached = JSON.parse(localStorage.getItem('hk_remote_channels')||'null');
  if(cached && Array.isArray(cached) && cached.length && cached[0] && cached[0].name){
    const lastName = (current>=0)?CHANNELS[current].name:null;
    CHANNELS = cached;
    if(lastName){ const ni=CHANNELS.findIndex(c=>c.name===lastName); if(ni>=0) current=ni; }
    render();
  }
  applyRemote();
})();
</script>
</body>
