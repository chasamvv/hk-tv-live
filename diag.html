<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>香港直播源 · 诊断</title>
<style>
body{background:#0d0d0f;color:#eaeaea;font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:18px}
h1{font-size:21px;margin:0 0 6px}
.sub{color:#8a8a8e;font-size:14px;margin-bottom:16px}
button{background:#0a84ff;color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:17px;width:100%}
button:disabled{background:#333;color:#888}
.box{background:#1a1a1d;border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #262629;padding:8px 0}
.row:last-child{border:0}
.name{color:#c8c8cc}
.val{font-family:ui-monospace,Consolas,monospace;font-size:15px;text-align:right;word-break:break-all}
.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:#7a7a7e;margin:8px 0 0;max-height:110px;overflow:auto}
h2{font-size:15px;color:#8a8a8e;font-weight:500;margin:0 0 8px}
</style>
</head>
<body>
<h1>香港直播源 · 诊断</h1>
<div class="sub">手机开好香港代理（全局），用浏览器打开本页，点下面按钮。全程约 1 分钟。</div>
<button id="go">开始诊断</button>
<div id="out"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const SRC = [
  ["港台电视31", "https://rthktv31-live.akamaized.net/hls/live/2036818/RTHKTV31/master.m3u8"],
  ["港台电视32", "https://rthktv32-live.akamaized.net/hls/live/2036819/RTHKTV32/master.m3u8"],
  ["HOY TV",     "https://hoytv-live-stream.hoy.tv/ch77/index.m3u8"],
  ["ViuTV",      "https://hoytv-live-stream.hoy.tv/ch99/index.m3u8"],
  ["Pet Club",   "https://petclub-samsungaus.amagi.tv/playlist.m3u8"],
  ["翡翠台(旧)",  "http://103.172.187.30:12000/stream/mytv/null-1/master.m3u8"]
];

const out = document.getElementById('out');
const go  = document.getElementById('go');
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function block(title){
  const d = document.createElement('div');
  d.className = 'box';
  d.innerHTML = '<h2>' + esc(title) + '</h2>';
  out.appendChild(d);
  return d;
}
function row(box, k, v, cls){
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<span class="name">' + esc(k) + '</span><span class="val ' + (cls||'') + '">' + esc(v) + '</span>';
  box.appendChild(d);
}

async function probe(url){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 9000);
  try{
    const r = await fetch(url, {signal: ctl.signal, cache:'no-store'});
    let txt = '';
    try{ txt = (await r.text()).slice(0, 60); }catch(e){}
    return {status: r.status, cors: r.type === 'cors' ? '是' : '否', m3u: txt.indexOf('#EXTM3U') === 0};
  }catch(e){
    return {err: e.name === 'AbortError' ? '超时(9秒)' : '请求失败 ' + e.message};
  }finally{ clearTimeout(t); }
}

async function getIP(){
  const tries = ['https://api.ip.sb/geoip', 'https://ipapi.co/json/', 'https://api.myip.com'];
  for(const u of tries){
    try{
      const ctl = new AbortController();
      const t = setTimeout(()=>ctl.abort(), 8000);
      const r = await fetch(u, {signal: ctl.signal, cache:'no-store'});
      const j = await r.json();
      clearTimeout(t);
      return {
        ip: j.ip || '-',
        cc: (j.country_code || j.country || '-'),
        org: (j.isp || j.org || j.asn_org || '-') + ' ' + (j.asn || '')
      };
    }catch(e){}
  }
  return null;
}

go.addEventListener('click', async ()=>{
  go.disabled = true; out.innerHTML = '';

  // 1. 出口 IP
  const b1 = block('① 当前出口 IP（应为 HK）');
  b1.innerHTML += '<div class="row"><span class="name">检测中…</span></div>';
  const info = await getIP();
  b1.innerHTML = '<h2>① 当前出口 IP（应为 HK）</h2>';
  if(info){
    row(b1, 'IP', info.ip, '');
    row(b1, '国家/地区', info.cc, info.cc === 'HK' ? 'ok' : 'bad');
    row(b1, '运营商/ASN', info.org.trim(), '');
  }else{
    row(b1, '结果', '检测不到（代理可能没覆盖浏览器）', 'bad');
  }

  // 2. 播放器内核
  const b2 = block('② 浏览器播放能力');
  row(b2, 'hls.js 已加载', (typeof Hls !== 'undefined') ? '是' : '否', (typeof Hls !== 'undefined') ? 'ok' : 'bad');
  row(b2, '原生 HLS 支持', (document.createElement('video').canPlayType('application/vnd.apple.mpegurl') || '不支持'), '');

  // 3. 逐源探测
  const b3 = block('③ 逐个源探测（重点看状态码和 CORS）');
  for(const [name, url] of SRC){
    const r = await probe(url);
    const kv = document.createElement('div');
    kv.style.cssText = 'padding:10px 0;border-bottom:1px solid #262629';
    let html = '<div style="margin-bottom:4px">' + esc(name) + '</div>';
    if(r.err){
      html += '<div class="val bad">' + esc(r.err) + '</div>';
    }else{
      const isOk = r.status === 200 && r.m3u;
      const cls = isOk ? 'ok' : 'bad';
      const note = isOk ? '可以播' : (r.status === 403 ? '403 被拒（地区锁/非香港出口）'
                  : r.status === 404 ? '404 地址已失效'
                  : r.status === 200 ? '200 但内容不是 m3u8' : 'HTTP ' + r.status);
      html += '<div class="val ' + cls + '">' + r.status + ' · ' + esc(note) + ' · CORS:' + esc(r.cors) + '</div>';
    }
    html += '<pre>' + esc(url) + '</pre>';
    kv.innerHTML = html;
    b3.appendChild(kv);
  }

  // 4. 结论
  const b4 = block('④ 怎么读这个结果');
  b4.innerHTML += '<div style="font-size:14px;line-height:1.8;color:#b8b8bc">' +
    '<b>地区是 HK + 源是 200 可以播</b> → 网络没问题，是网页播放器的问题，换 VLC / IPTV 播放器。<br>' +
    '<b>地区不是 HK</b> → 代理没覆盖浏览器，换全局模式或换浏览器。<br>' +
    '<b>地区是 HK 但源 403</b> → 这个节点不是真香港落地，换节点。<br>' +
    '<b>请求失败/超时</b> → 域名被拦或节点不通。</div>';

  go.disabled = false;
  go.textContent = '重新诊断';
});
</script>
</body>
</html>
